# Checks for every pull request and every push to main (docs/testing.md, "CI"), then deploys:
# preview on main, production on a `v*` tag (docs/deployment.md, "Environments and CI/CD").
# Actions are pinned to commit SHAs (docs/security.md); Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @mfcd/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mfcd/web exec playwright install --with-deps chromium

      - name: Install Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mfcd/web exec playwright install-deps chromium

      - run: pnpm check:full

      - name: Upload logs and Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs
          path: |
            .logs/latest/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Contributors may use Windows without WSL (project lead, 2026-11-03), so the scripts must run
  # there too. No e2e: `check` covers the browser tests. Not a required check.
  check-windows:
    name: check (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Real-time antivirus scans every file the tests write (each API test copies a small D1
      # database), which made this job about 12x slower than Linux. Skip the folders the build
      # and tests write to. Warn, not fail, if the runner image changes.
      - name: Skip antivirus scans of the build folders
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, "$env:LOCALAPPDATA\pnpm"
            Write-Output "Excluded: $((Get-MpPreference).ExclusionPath -join ', ')"
          } catch {
            Write-Output "::warning::Could not add antivirus exclusions: $_"
          }

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-windows-logs
          path: .logs/latest/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Known vulnerabilities (high or critical) in packages the deployed site uses.
      - run: pnpm audit --prod --audit-level high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Free for repos owned by a personal account. An organization owner needs a free
      # GITLEAKS_LICENSE secret (https://gitleaks.io).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  deploy-preview:
    name: deploy preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, audit, gitleaks]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
    secrets: inherit

  # Waits for the `production` environment's required reviewer.
  deploy-production:
    name: deploy production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, audit, gitleaks]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
