# Weekly dependency updates. `cooldown` matches the 3-day minimumReleaseAge in
# pnpm-workspace.yaml, so Dependabot never proposes a version pnpm would refuse.
# Security updates ignore cooldown; if one is too new for pnpm, wait (docs/security.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    # Held back (2026-11-14): workerd 1.20261110 rejects the state-similarity statement.
    # Remove after it is rewritten (docs/status.md, "Known limits").
    ignore:
      - dependency-name: wrangler
      - dependency-name: '@cloudflare/vitest-plugin'
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        update-types: [major, minor, patch]
