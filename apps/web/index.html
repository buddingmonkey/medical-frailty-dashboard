<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Compare the code lists US states use to mark Medicaid members as medically frail."
    />
    <!-- No nonce: ui-sdk then adds its CSS as constructed style sheets, which our CSP
         (style-src 'self', no 'unsafe-inline') allows. docs/security.md. -->
    <meta property="csp-nonce" content="none" />
    <title>Medical Frailty Coding Dashboard</title>
    <!-- Icons, manifest and theme colours: SITE_ICONS and THEME_COLORS in packages/shared
         (scripts/make-icons.ts writes the files). The Worker writes the same tags itself. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0c2a59" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#031b3f" media="(prefers-color-scheme: dark)" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
