# Weekly dependency updates. `cooldown` matches the 3-day minimumReleaseAge in
# pnpm-workspace.yaml, so Dependabot never proposes a version pnpm would refuse.
# Security updates ignore cooldown; if one is too new for pnpm, wait (docs/security.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        update-types: [major, minor, patch]
