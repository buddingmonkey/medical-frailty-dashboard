# Loads the reference data (CMS ref_codes, AHRQ CCSR ref_ccsr) into one environment's D1, in
# resumable chunks under a daily row budget (packages/reference-data/README.md). Run by hand from
# the Actions tab; run it again the next day until it reports nothing left. Production waits for
# the `production` environment's required reviewer, like a production deploy.
name: Reference data

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database
        required: true
        type: choice
        options: [preview, production]
      max_rows:
        description: Rows to write in this run (free tier allows 100,000 a day for the account)
        required: true
        default: '80000'

permissions:
  contents: read

jobs:
  load:
    name: load ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      # Never alongside a deploy of the same environment (it may be migrating).
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # wrangler.jsonc holds placeholder D1 ids; the real one comes from the GitHub environment
      # (scripts/d1-ids.ts, docs/deployment.md).
      - name: Set the D1 database id
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          TARGET: ${{ inputs.environment }}
        run: |
          test -n "$D1_DATABASE_ID" || {
            echo "::error::Set D1_DATABASE_ID in the $TARGET environment"
            exit 1
          }
          node scripts/d1-ids.ts "--$TARGET" "$D1_DATABASE_ID"

      - run: pnpm install --frozen-lockfile

      # Downloads the pinned CMS and AHRQ CCSR files and checks their SHA-256.
      - run: pnpm --filter @mfcd/reference-data build

      - name: Load
        # `shell: bash` adds pipefail, so a failed load fails the step despite the tee.
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.environment }}
          MAX_ROWS: ${{ inputs.max_rows }}
        run: |
          [[ "$MAX_ROWS" =~ ^[0-9]+$ ]] || { echo "::error::max_rows must be a number"; exit 1; }
          pnpm --filter @mfcd/reference-data load --env "$TARGET" --max-rows "$MAX_ROWS" \
            | tee -a "$GITHUB_STEP_SUMMARY"
